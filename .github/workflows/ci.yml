name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            bench: true
          - os: ubuntu-latest
            python: "3.12"
            bench: true
          - os: macos-latest
            python: "3.12"
            bench: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        # Floating ruff/mypy releases change format and types under the feet of
        # the locked benchmark environment. The lock is the CI pin.
        run: |
          pip install -e ".[dev,bench,ocr]" -c benchmarks/requirements.lock
          # rapidocr depends on opencv-python, which would replace the headless
          # 4.10 pin with OpenCV 5 and break cv2. Put the locked wheel back.
          pip install --force-reinstall --no-deps opencv-python-headless==4.10.0.84
      - name: Lint
        run: |
          ruff check src tests benchmarks
          ruff format --check src tests benchmarks
          mypy --strict src/curve2csv
      - name: Test
        run: pytest --cov=curve2csv --cov-fail-under=80
      - name: Smoke benchmark
        if: matrix.bench
        run: make bench-smoke

  bench-full:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bench-full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Floating ruff/mypy releases change format and types under the feet of
        # the locked benchmark environment. The lock is the CI pin.
        run: |
          pip install -e ".[dev,bench,ocr]" -c benchmarks/requirements.lock
          # rapidocr depends on opencv-python, which would replace the headless
          # 4.10 pin with OpenCV 5 and break cv2. Put the locked wheel back.
          pip install --force-reinstall --no-deps opencv-python-headless==4.10.0.84
      - name: Full synthetic test split
        run: make bench-test
      - uses: actions/upload-artifact@v4
        with:
          name: m1-benchmark
          path: |
            benchmarks/results/M1.json
            benchmarks/results/M1.md
            benchmarks/results/M1_failures/
