name: windows

on:
  push:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - "android/app/src/main/assets/smoke.png"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - "android/app/src/main/assets/smoke.png"
      - ".github/workflows/windows.yml"

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[gui,ocr]" pyinstaller
          python -m pip install --force-reinstall --no-deps opencv-python-headless==4.10.0.84
      - name: Build the Windows exe
        run: |
          pyinstaller --noconfirm --clean --name curve2csv --console --paths src --collect-submodules curve2csv --collect-all tkinterdnd2 --collect-all pypdfium2 --collect-all rapidocr_onnxruntime --collect-all onnxruntime packaging/entry.py
      - name: Headless smoke
        shell: pwsh
        run: |
          .\dist\curve2csv\curve2csv.exe --headless-smoke android\app\src\main\assets\smoke.png -o smoke-out
          if (-not (Test-Path smoke-out\smoke.csv)) { exit 1 }
          if (-not (Select-String -Path smoke-out\smoke.csv -Pattern "series_id" -Quiet)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: curve2csv-windows-exe
          path: dist/curve2csv/
          if-no-files-found: error
