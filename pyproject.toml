[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "curve2csv"
version = "0.1.0.dev0"
description = "Digitize scientific line, scatter, and bar charts into CSV and JSON."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "asdfgtrewq748" }]
keywords = ["digitization", "charts", "scientific-figures", "csv"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "scikit-image>=0.21",
  "scipy>=1.11",
]

[project.optional-dependencies]
bench = [
  "matplotlib>=3.8",
  "PyYAML>=6",
  "jsonschema>=4.18",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.18",
  "matplotlib>=3.8",
  "PyYAML>=6",
]
ocr = [
  "rapidocr-onnxruntime>=1.3",
]
gui = [
  "pypdfium2>=4.30",
  "tkinterdnd2>=0.3",
]

[project.scripts]
curve2csv = "curve2csv.__main__:main"

[project.urls]
Homepage = "https://github.com/asdfgtrewq748/Curve2csv"
Repository = "https://github.com/asdfgtrewq748/Curve2csv"

[tool.hatch.build.targets.wheel]
packages = ["src/curve2csv"]

[tool.hatch.build.targets.sdist]
include = ["src/curve2csv", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["curve2csv"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["curve2csv", "benchmarks"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
packages = ["curve2csv"]
mypy_path = "src"
# NumPy arrays are annotated at the public boundary. Internal cv2/skimage
# buffers stay unparameterized so --strict stays usable on Python 3.10.
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = [
  "cv2",
  "cv2.*",
  "skimage",
  "skimage.*",
  "PIL",
  "PIL.*",
  "yaml",
  "rapidocr_onnxruntime",
  "rapidocr_onnxruntime.*",
  "pypdfium2",
  "pypdfium2.*",
  "tkinterdnd2",
  "tkinterdnd2.*",
]
ignore_missing_imports = true
follow_imports = "skip"
